<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 150">
  <!-- Back D (dark navy, top-right position) -->
  <!-- Pentagon vertices: top-left, top-right(higher), right peak, bottom-right, bottom-left -->
  <path d="M 50 30 L 110 30 L 135 75 L 110 120 L 50 120 Z"
        fill="none" stroke="#0F1B3E" stroke-width="5"
        stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Front D (violet, bottom-left position, offset by ~15px down-left from back) -->
  <path d="M 35 45 L 95 45 L 120 90 L 95 135 L 35 135 Z"
        fill="none" stroke="#7B1FA2" stroke-width="5"
        stroke-linejoin="round" stroke-linecap="round"/>

  <!-- "Bat" text -->
  <text x="160" y="105" font-family="Helvetica,Arial,sans-serif"
        font-weight="900" font-size="82" fill="#0F1B3E">Bat</text>

  <!-- "ia" text (italic, smaller, same baseline) -->
  <text x="305" y="105" font-family="Helvetica,Arial,sans-serif"
        font-style="italic" font-weight="600" font-size="64" fill="#0F1B3E">ia</text>
</svg>
