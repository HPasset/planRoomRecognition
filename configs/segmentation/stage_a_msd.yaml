run_name: stage_a_msd_v1
seed: 42

data:
  dataset_root: data/processed/msd_panoptic
  image_size: 512        # 768->512 : ~2.3x plus rapide (prior Stage A, FR remonte en Stage B)
  batch_size: 4
  num_workers: 8         # overlap data/GPU sur le cloud (Mac local: laisser 0)

model:
  backbone: facebook/mask2former-swin-small-coco-panoptic

optimizer:
  lr_backbone: 1.0e-5
  lr_head: 1.0e-4
  weight_decay: 0.05
  grad_accumulation: 4
  grad_clip_norm: 1.0

scheduler:
  type: cosine
  warmup_steps: 1000

training:
  epochs: 40             # 80->40 : généreux pour un pré-train ; early-stop actif
  early_stop_patience: 10
  mixed_precision: "bf16"   # A10G OK ; ~½ mémoire d'activation (évite l'OOM 768/batch4)
  oversample_rare_classes: true

logging:
  tracker: wandb
  project: batia-segmentation
  log_image_count: 5

checkpoint:
  output_dir: runs/segmentation/stage_a_msd_v1
  save_every_n_epochs: 10
