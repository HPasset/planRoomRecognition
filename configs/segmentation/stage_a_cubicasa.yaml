run_name: stage_a_cubicasa_v1
seed: 42

data:
  dataset_root: data/processed/cubicasa_panoptic
  image_size: 768
  batch_size: 4

model:
  backbone: facebook/mask2former-swin-small-coco-panoptic

optimizer:
  lr_backbone: 1.0e-5
  lr_head: 1.0e-4
  weight_decay: 0.05
  grad_accumulation: 4
  grad_clip_norm: 1.0

scheduler:
  type: cosine
  warmup_steps: 1000

training:
  epochs: 80
  early_stop_patience: 10
  mixed_precision: "no"
  oversample_rare_classes: true

logging:
  tracker: wandb
  project: batia-segmentation
  log_image_count: 5

checkpoint:
  output_dir: runs/segmentation/stage_a_cubicasa_v1
  save_every_n_epochs: 10
